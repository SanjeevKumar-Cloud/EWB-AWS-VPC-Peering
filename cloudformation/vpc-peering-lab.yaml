AWSTemplateFormatVersion: '2010-09-09'
Description: 'EWB Cloud Labs - AWS VPC Peering Complete Infrastructure Template'

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair (must be ewb-lab)
    Default: ewb-lab
  MyIpCidr:
    Type: String
    Description: Your public IPv4 CIDR for Bastion SSH access (e.g., 203.0.113.25/32)
    Default: 0.0.0.0/0
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  # VPC A (10.10.0.0/16)
  VpcA:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.10.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: ewb-vpc-a
        - Key: Project
          Value: EWB-VPC-Peering
        - Key: Student
          Value: Sanjeev Kumar

  SubnetAPublic:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcA
      CidrBlock: 10.10.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: ewb-a-public

  SubnetAPrivate:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcA
      CidrBlock: 10.10.2.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: ewb-a-private

  InternetGatewayA:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: ewb-igw-a

  AttachGatewayA:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VpcA
      InternetGatewayId: !Ref InternetGatewayA

  RouteTableAPublic:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcA
      Tags:
        - Key: Name
          Value: ewb-rt-a-public

  SubnetAssocAPublic:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetAPublic
      RouteTableId: !Ref RouteTableAPublic

  RouteAPublicInternet:
    Type: AWS::EC2::Route
    DependsOn: AttachGatewayA
    Properties:
      RouteTableId: !Ref RouteTableAPublic
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewayA

  RouteTableAPrivate:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcA
      Tags:
        - Key: Name
          Value: ewb-rt-a-private

  SubnetAssocAPrivate:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetAPrivate
      RouteTableId: !Ref RouteTableAPrivate

  # VPC B (10.20.0.0/16)
  VpcB:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: ewb-vpc-b
        - Key: Project
          Value: EWB-VPC-Peering
        - Key: Student
          Value: Sanjeev Kumar

  SubnetBPrivate:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcB
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: ewb-b-private

  RouteTableBPrivate:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcB
      Tags:
        - Key: Name
          Value: ewb-rt-b-private

  SubnetAssocBPrivate:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetBPrivate
      RouteTableId: !Ref RouteTableBPrivate

  # Peering Connection
  VpcPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId: !Ref VpcA
      PeerVpcId: !Ref VpcB
      Tags:
        - Key: Name
          Value: ewb-a-b-peer

  # Peering Routes
  RouteAPublicPeering:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTableAPublic
      DestinationCidrBlock: 10.20.0.0/16
      VpcPeeringConnectionId: !Ref VpcPeeringConnection

  RouteAPrivatePeering:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTableAPrivate
      DestinationCidrBlock: 10.20.0.0/16
      VpcPeeringConnectionId: !Ref VpcPeeringConnection

  RouteBPrivatePeering:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTableBPrivate
      DestinationCidrBlock: 10.10.0.0/16
      VpcPeeringConnectionId: !Ref VpcPeeringConnection

  # Security Groups
  SecurityGroupBastion:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: ewb-sg-bastion
      GroupDescription: Bastion administrative SSH
      VpcId: !Ref VpcA
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpCidr
      Tags:
        - Key: Name
          Value: ewb-sg-bastion

  SecurityGroupAppA:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: ewb-sg-app-a
      GroupDescription: Security group for App-A
      VpcId: !Ref VpcA
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.10.1.10/32
        - IpProtocol: icmp
          FromPort: 8
          ToPort: 0
          CidrIp: 10.20.1.10/32
      Tags:
        - Key: Name
          Value: ewb-sg-app-a

  SecurityGroupAppB:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: ewb-sg-app-b
      GroupDescription: Security group for App-B
      VpcId: !Ref VpcB
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.10.1.10/32
        - IpProtocol: icmp
          FromPort: 8
          ToPort: 0
          CidrIp: 10.10.2.10/32
      Tags:
        - Key: Name
          Value: ewb-sg-app-b

  # EC2 Instances
  InstanceBastion:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref SubnetAPublic
      PrivateIpAddress: 10.10.1.10
      SecurityGroupIds:
        - !Ref SecurityGroupBastion
      Tags:
        - Key: Name
          Value: ewb-bastion

  InstanceAppA:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref SubnetAPrivate
      PrivateIpAddress: 10.10.2.10
      SecurityGroupIds:
        - !Ref SecurityGroupAppA
      Tags:
        - Key: Name
          Value: ewb-app-a

  InstanceAppB:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref SubnetBPrivate
      PrivateIpAddress: 10.20.1.10
      SecurityGroupIds:
        - !Ref SecurityGroupAppB
      Tags:
        - Key: Name
          Value: ewb-app-b

Outputs:
  BastionPublicIp:
    Description: Public IP of ewb-bastion
    Value: !GetAtt InstanceBastion.PublicIp
  PeeringId:
    Description: Peering Connection ID
    Value: !Ref VpcPeeringConnection
